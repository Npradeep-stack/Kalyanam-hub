<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Contact Us - Kalyanam Hub</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --gold: #D4AF37;
  --bg: #05070A;
  --card-bg: #0F131E;
  --text: #F8FAFC;
  --dim: #94A3B8;
  --border: rgba(255, 255, 255, 0.1);
  --dock-height: 80px; /* Standard Mobile Dock Height */
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  padding-bottom: calc(var(--dock-height) + 40px); /* Safety space for dock */
}

/* HEADER */
.header {
  text-align: center;
  padding: 40px 10px 20px;
}

.header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem;
  margin: 0;
  color: var(--gold);
}

/* CONTAINER */
.container {
  width: 100%;
  max-width: 450px; /* Mobile width focus */
  margin: auto;
  background: var(--card-bg);
  padding: 24px;
  border-radius: 24px;
  border: 1px solid var(--border);
}

/* FINGER FRIENDLY INPUTS (Height 56px) */
input, select, textarea {
  width: 100%;
  height: 56px; 
  padding: 0 16px;
  margin-bottom: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: white;
  font-size: 16px; /* No auto-zoom on mobile */
  outline: none;
}

textarea { height: 120px; padding-top: 16px; }

/* MAIN CTA (Haptic Feedback) */
.cta-submit {
  width: 100%;
  height: 60px; /* Large Target */
  background: var(--gold);
  color: black;
  border: none;
  border-radius: 12px;
  font-weight: 800;
  font-size: 16px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.cta-submit:active {
  transform: scale(0.96);
}

/* MOBILE ACTION DOCK (FIXED & FULL WIDTH) */
.mobile-action-dock {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: var(--dock-height);
  background: rgba(10, 10, 15, 0.98);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 0 10px;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 1000;
}

.dock-item {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--dim);
  gap: 4px;
}

.dock-item:active {
  background: rgba(255,255,255,0.05);
}

.dock-item i { 
  font-size: 24px; /* Larger finger targets */
}

.dock-item span { 
  font-size: 11px; 
  font-weight: 700; 
  text-transform: uppercase;
}

.dock-item.active { 
  color: var(--gold); 
}

/* CENTER CIRCLE BUTTON */
.thumb-cta-center {
  position: relative;
  top: -25px; /* Floats above dock */
  background: var(--gold);
  color: black;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
  border: 6px solid var(--bg);
  transition: 0.2s;
}

.thumb-cta-center i { font-size: 26px; }

.thumb-cta-center:active {
  transform: scale(0.9);
}

@media (min-width: 1024px) {
  .mobile-action-dock { display: none; }
  body { padding-bottom: 20px; }
}
</style>
</head>

<body>

<div class="header">
  <h1>Contact Us</h1>
  <p style="color: var(--dim); font-size: 15px;">We reply within 24 hours</p>
</div>

<div class="container">
  <form onsubmit="handleSubmit(event)">
    <input type="text" placeholder="Full Name" required>
    <input type="tel" placeholder="Mobile Number" required>
    <select required>
      <option value="">Event Type</option>
      <option>Wedding</option>
      <option>Private Party</option>
      <option>Corporate</option>
    </select>
    <textarea placeholder="Tell us what you're looking for..."></textarea>
    
    <button type="submit" class="cta-submit">Send Message</button>
  </form>
</div>

<!-- NAV BAR VISIBLE FOR MOBILE -->
<nav class="mobile-action-dock">
  <a href="index.html" class="dock-item">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </a>
  <a href="venues.html" class="dock-item">
    <i class="fa-solid fa-hotel"></i>
    <span>Venues</span>
  </a>
  
  <a href="booking.html" class="thumb-cta-center">
    <i class="fa-solid fa-calendar-check"></i>
  </a>
  
  <a href="services.html" class="dock-item">
    <i class="fa-solid fa-crown"></i>
    <span>Services</span>
  </a>
  <a href="contactus.html" class="dock-item active">
    <i class="fa-solid fa-headset"></i>
    <span>Support</span>
  </a>
</nav>

<script>
function handleSubmit(e){
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Sending...";
  setTimeout(() => {
    alert("Message Received! We'll call you soon.");
    btn.innerHTML = "Send Message";
  }, 1000);
}
</script>

</body>
</html>
