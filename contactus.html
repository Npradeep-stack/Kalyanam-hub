<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Contact Us - Kalyanam Hub</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --gold: #D4AF37;
  --bg: #05070A;
  --card-bg: #0F131E;
  --text: #F8FAFC;
  --dim: #94A3B8;
  --border: rgba(255, 255, 255, 0.08);
  --glow: rgba(212, 175, 55, 0.3);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  padding-bottom: 140px; 
}

/* HEADER */
.header {
  text-align: center;
  padding: 40px 10px 20px;
}

.header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem;
  margin-bottom: 8px;
  color: var(--gold);
}

/* CONTAINER */
.container {
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: var(--card-bg);
  padding: 30px;
  border-radius: 32px;
  border: 1px solid var(--border);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

/* THUMB-FRIENDLY INPUTS */
.input-group {
    position: relative;
    margin-bottom: 20px;
}

input, select, textarea {
  width: 100%;
  padding: 18px; 
  border-radius: 16px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  color: white;
  outline: none;
  font-size: 16px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

input:focus, select:focus, textarea:focus {
  border-color: var(--gold);
  background: rgba(255,255,255,0.07);
  box-shadow: 0 0 15px var(--glow);
  transform: translateY(-2px);
}

/* CTA BUTTON - HAPTIC INTERACTION */
.cta-submit {
  width: 100%;
  padding: 20px;
  margin-top: 10px;
  background: var(--gold);
  color: black;
  border: none;
  border-radius: 18px;
  font-weight: 800;
  font-size: 1.1rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
  transition: all 0.2s ease;
}

.cta-submit:active {
  transform: scale(0.95);
  box-shadow: 0 5px 10px rgba(212, 175, 55, 0.1);
}

/* INFO PILL */
.info-pill {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 25px;
    padding: 15px;
    background: rgba(255,255,255,0.03);
    border-radius: 50px;
    text-decoration: none;
    color: var(--dim);
    font-size: 14px;
    border: 1px solid var(--border);
}

.info-pill:active {
    background: rgba(255,255,255,0.1);
    transform: scale(0.98);
}

.info-pill i { color: var(--gold); font-size: 18px; }

/* MOBILE ACTION DOCK */
.mobile-action-dock {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 95px; background: rgba(5, 7, 10, 0.98);
  backdrop-filter: blur(40px); border-top: 1px solid var(--border);
  z-index: 9999; display: flex; justify-content: space-around; align-items: center;
  padding-bottom: env(safe-area-inset-bottom);
}

.dock-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-decoration: none; color: var(--dim); gap: 4px;
}

.dock-item:active { transform: scale(0.9); }
.dock-item i { font-size: 22px; }
.dock-item span { font-size: 10px; font-weight: 700; text-transform: uppercase; }
.dock-item.active { color: var(--gold); }

.thumb-cta-center {
  position: relative; top: -30px;
  background: var(--gold); color: #000;
  width: 72px; height: 72px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 15px 35px rgba(212, 175, 55, 0.4);
  border: 6px solid var(--bg);
}

@media (min-width: 1024px) {
  .mobile-action-dock { display: none; }
  body { padding-bottom: 20px; }
}
</style>
</head>

<body>

<div class="header">
  <h1>Contact Us</h1>
  <p style="color: var(--dim);">We are here to help you find the perfect venue</p>
</div>

<div class="container">
  <form onsubmit="submitForm(event)">
    <div class="input-group">
        <input type="text" placeholder="Full Name" required>
    </div>
    <div class="input-group">
        <input type="tel" placeholder="Mobile Number" required>
    </div>
    <div class="input-group">
        <select required>
          <option value="">Select Event Type</option>
          <option>Wedding</option>
          <option>Birthday Party</option>
          <option>Corporate Event</option>
          <option>Other</option>
        </select>
    </div>
    <div class="input-group">
        <textarea rows="3" placeholder="How can we help you?"></textarea>
    </div>
    
    <button type="submit" class="cta-submit">Send Message</button>
  </form>

  <a href="tel:+919390653955" class="info-pill">
    <i class="fa-solid fa-phone"></i> Call Support: +91 9390653955
  </a>
</div>

<!-- NAV BAR -->
<nav class="mobile-action-dock">
  <a href="index.html" class="dock-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="venues.html" class="dock-item"><i class="fa-solid fa-hotel"></i><span>Venues</span></a>
  
  <a href="booking.html" class="thumb-cta-center">
      <i class="fa-solid fa-calendar-check"></i>
  </a>
  
  <a href="services.html" class="dock-item"><i class="fa-solid fa-crown"></i><span>Services</span></a>
  <a href="contactus.html" class="dock-item active"><i class="fa-solid fa-headset"></i><span>Support</span></a>
</nav>

<script>
function submitForm(e){
  e.preventDefault();
  const btn = document.querySelector('.cta-submit');
  btn.innerHTML = "<i class='fa-solid fa-circle-notch fa-spin'></i> Sending...";
  
  setTimeout(() => {
      alert("✅ Thank you! We will get back to you shortly.");
      btn.innerHTML = "Send Message";
  }, 1000);
}
</script>

</body>
</html>
