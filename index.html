<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | Kalyanam Hub Support</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --gold: #D4AF37;
            --bg: #05070A;
            --card-bg: #0F131E;
            --text: #F8FAFC;
            --dim: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
            padding-bottom: 120px; /* Space for the dock */
        }

        header {
            padding: 40px 20px;
            text-align: center;
        }

        .logo { 
            font-family: 'Playfair Display', serif; 
            font-size: 22px; color: var(--gold); 
            text-decoration: none; font-weight: 900; letter-spacing: -0.5px;
            display: block; margin-bottom: 20px;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 10px; }
        .subtitle { color: var(--dim); font-size: 14px; margin-bottom: 30px; }

        .container { width: 90%; max-width: 500px; margin: 0 auto; }

        /* FORM STYLING */
        .form-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #161B26;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 16px; /* Prevents mobile zoom */
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--gold);
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:active { transform: scale(0.96); }

        /* CONTACT INFO */
        .contact-info {
            margin-top: 40px;
            text-align: center;
        }

        .info-link {
            display: block;
            color: var(--text);
            text-decoration: none;
            margin: 15px 0;
            font-size: 15px;
            font-weight: 600;
        }

        .info-link i { color: var(--gold); margin-right: 10px; font-size: 18px; }

        /* ACTION DOCK (Same as index) */
        .mobile-action-dock {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 95px; background: rgba(5, 7, 10, 0.98);
            backdrop-filter: blur(40px); border-top: 1px solid var(--border);
            z-index: 9999; display: flex; justify-content: space-around; align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .dock-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-decoration: none; color: var(--dim); gap: 4px;
        }

        .dock-item i { font-size: 22px; }
        .dock-item span { font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .dock-item.active { color: var(--gold); }

        .thumb-cta-center {
            position: relative; top: -30px;
            background: var(--gold); color: #000;
            width: 70px; height: 70px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 6px solid var(--bg);
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">KALYANAM HUB</a>
    <h1>Support Concierge</h1>
    <p class="subtitle">Experience priority assistance for your event brokerage needs.</p>
</header>

<main class="container">
    <div class="form-card">
        <form onsubmit="submitForm(event)">
            <input type="text" placeholder="Full Name" required>
            <input type="tel" placeholder="Mobile Number" required>
            <select required>
                <option value="">Event Category</option>
                <option>Premium Wedding</option>
                <option>Corporate Gala</option>
                <option>Private Estate Event</option>
            </select>
            <textarea rows="4" placeholder="How can our experts assist you?"></textarea>
            <button type="submit">Initialize Contact</button>
        </form>
    </div>

    <div class="contact-info">
        <a href="tel:+919390653955" class="info-link">
            <i class="fa-solid fa-phone"></i> +91 9390653955
        </a>
        <a href="mailto:contact.kalyanamhub@gmail.com" class="info-link">
            <i class="fa-solid fa-envelope"></i> contact.kalyanamhub@gmail.com
        </a>
        <p style="color: var(--dim); font-size: 12px; margin-top: 20px;">
            <i class="fa-solid fa-location-dot" style="color: var(--gold);"></i> Andhra Pradesh, India
        </p>
    </div>
</main>

<!-- BOTTOM DOCK (Navigation) -->
<nav class="mobile-action-dock">
    <a href="index.html" class="dock-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="venues.html" class="dock-item"><i class="fa-solid fa-hotel"></i><span>Venues</span></a>
    
    <a href="booking.html" class="thumb-cta-center">
        <i class="fa-solid fa-calendar-check"></i>
    </a>
    
    <a href="services.html" class="dock-item"><i class="fa-solid fa-crown"></i><span>Services</span></a>
    <a href="contactus.html" class="dock-item active"><i class="fa-solid fa-headset"></i><span>Support</span></a>
</nav>

<script>
function submitForm(e){
    e.preventDefault();
    alert("✅ Concierge Request Sent. We will contact you shortly.");
}
</script>

</body>
</html>
